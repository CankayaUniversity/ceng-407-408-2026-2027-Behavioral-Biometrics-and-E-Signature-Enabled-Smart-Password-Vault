name: Vault cross-platform tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  vault-security:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths in Git for Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vault test dependencies
        run: python -m pip install pytest cryptography argon2-cffi jsonschema
      - name: Install Windows ACL dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywin32
      - name: Run security unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/unit/security -q
