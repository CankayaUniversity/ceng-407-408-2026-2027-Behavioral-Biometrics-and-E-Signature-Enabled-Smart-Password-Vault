name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Security tests
        run: python -m pytest tests/unit/security -v

      - name: Device tests
        run: |
          python -m pytest \
            tests/unit/test_mock_device.py \
            tests/unit/test_fingerprint_model.py \
            tests/unit/test_device_signing.py \
            tests/unit/test_device_protocol.py -v

      - name: Behavioral AI tests
        run: python -m pytest packages/behavioral_ai/tests -v

      - name: Backend tests
        run: python -m pytest tests/integration/test_backend_health.py -v

  ui:
    name: UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/desktop/ui/app-ui-kit

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/desktop/ui/app-ui-kit/.nvmrc

      - name: Use project npm version
        run: npm install --global npm@11.20.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build