openapi: 3.1.0
info:
  title: Authentication API
  version: 0.1.0
  description: User registration and device pairing are implemented in BE-05. Challenge,
    verification, and session operations are draft contracts. Missing security declarations
    do not imply public access. Response timestamps must be normalized to UTC. Device
    signatures cover version, challenge_id, device_id, and payload. Session binding
    is resolved from the stored challenge. See auth_api.md and device_protocol.md.
paths:
  /v1/users:
    post:
      summary: Create a user and issue a single-use pairing code
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
          headers:
            Cache-Control:
              description: Prevents caching of the pairing credential.
              schema:
                type: string
                const: no-store
        '422':
          description: 'VALIDATION_ERROR: invalid registration request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL_ERROR: unable to create user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      description: The pairing code belongs to the newly created user and expires
        five minutes after issuance.
  /v1/devices/pair:
    post:
      summary: Register a pending device using a pairing code
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePairResponse'
        '401':
          description: 'UNAUTHORIZED: pairing code is missing, invalid, expired, already
            used, or issued for a different user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              description: Authentication challenge.
              schema:
                type: string
                const: Bearer
        '409':
          description: 'DEVICE_ALREADY_REGISTERED: the device ID already exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: invalid request fields or public key encoding.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL_ERROR: unable to register device.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePairRequest'
      security:
      - PairingCode: []
      description: Send the registration pairing code in the Authorization bearer
        header. The public key must be 32 raw Ed25519 bytes encoded as unpadded Base64url.
        A successful registration consumes the code and creates a PENDING device record
        in the same transaction.
  /v1/auth/challenges:
    post:
      summary: Create an authentication challenge (draft)
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallengeCreateResponse'
        '401':
          description: 'UNAUTHORIZED: required credentials are missing, invalid, or
            expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              description: Authentication challenge.
              schema:
                type: string
        '403':
          description: 'FORBIDDEN: the caller lacks permission or the session state
            disallows the operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: request fields or cross-field constraints
            are invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'RATE_LIMITED: request or authentication attempt limit exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeCreateRequest'
  /v1/auth/verify:
    post:
      summary: Submit a signed device response (draft)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthVerifyResponse'
        '401':
          description: 'UNAUTHORIZED: required credentials are missing, invalid, or
            expired. Device verification may also return EXPIRED_CHALLENGE, INVALID_SIGNATURE,
            DEVICE_MISMATCH, REQUEST_MISMATCH, or VERIFICATION_FAILED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              description: Authentication challenge.
              schema:
                type: string
        '403':
          description: 'FORBIDDEN: the caller lacks permission or the session state
            disallows the operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: request fields or cross-field constraints
            are invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'RATE_LIMITED: request or authentication attempt limit exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 'INVALID_CHALLENGE: the referenced challenge is unknown.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'REPLAY_DETECTED: the challenge was already consumed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerifyRequest'
  /v1/sessions/{session_id}:
    get:
      summary: Read an authorized session (draft)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: 'UNAUTHORIZED: required credentials are missing, invalid, or
            expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              description: Authentication challenge.
              schema:
                type: string
        '403':
          description: 'FORBIDDEN: the caller lacks permission or the session state
            disallows the operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: request fields or cross-field constraints
            are invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'RATE_LIMITED: request or authentication attempt limit exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'NOT_FOUND: an authorized resource lookup found no matching
            resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 36
  /v1/sessions/{session_id}/revoke:
    post:
      summary: Revoke an authorized session (draft)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: 'UNAUTHORIZED: required credentials are missing, invalid, or
            expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            WWW-Authenticate:
              description: Authentication challenge.
              schema:
                type: string
        '403':
          description: 'FORBIDDEN: the caller lacks permission or the session state
            disallows the operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: request fields or cross-field constraints
            are invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'RATE_LIMITED: request or authentication attempt limit exceeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'NOT_FOUND: an authorized resource lookup found no matching
            resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 36
components:
  schemas:
    UserCreateRequest:
      additionalProperties: false
      properties:
        display_name:
          maxLength: 100
          minLength: 1
          title: Display Name
          type: string
      required:
      - display_name
      title: UserCreateRequest
      type: object
    UserRegistrationResponse:
      additionalProperties: false
      properties:
        user_id:
          title: User Id
          type: string
        display_name:
          title: Display Name
          type: string
        enrollment_status:
          title: Enrollment Status
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        pairing_code:
          title: Pairing Code
          type: string
        pairing_code_expires_at:
          format: date-time
          title: Pairing Code Expires At
          type: string
      required:
      - user_id
      - display_name
      - enrollment_status
      - created_at
      - pairing_code
      - pairing_code_expires_at
      title: UserRegistrationResponse
      type: object
    DevicePairRequest:
      additionalProperties: false
      properties:
        user_id:
          maxLength: 36
          minLength: 1
          title: User Id
          type: string
        device_id:
          maxLength: 36
          minLength: 1
          title: Device Id
          type: string
        public_key:
          minLength: 1
          title: Public Key
          type: string
      required:
      - user_id
      - device_id
      - public_key
      title: DevicePairRequest
      type: object
    DevicePairResponse:
      additionalProperties: false
      properties:
        device_id:
          title: Device Id
          type: string
        user_id:
          title: User Id
          type: string
        pairing_status:
          title: Pairing Status
          type: string
      required:
      - device_id
      - user_id
      - pairing_status
      title: DevicePairResponse
      type: object
    AuthChallengeCreateRequest:
      additionalProperties: false
      properties:
        user_id:
          maxLength: 36
          minLength: 1
          title: User Id
          type: string
        device_id:
          maxLength: 36
          minLength: 1
          title: Device Id
          type: string
        purpose:
          enum:
          - login
          - reauthentication
          title: Purpose
          type: string
        session_id:
          anyOf:
          - maxLength: 36
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Session Id
      required:
      - user_id
      - device_id
      - purpose
      title: AuthChallengeCreateRequest
      type: object
    AuthChallengeResponse:
      additionalProperties: false
      properties:
        version:
          maximum: 1
          minimum: 1
          title: Version
          type: integer
        challenge_id:
          minLength: 1
          title: Challenge Id
          type: string
        request_id:
          minLength: 1
          title: Request Id
          type: string
        user_id:
          minLength: 1
          title: User Id
          type: string
        device_id:
          minLength: 1
          title: Device Id
          type: string
        purpose:
          enum:
          - login
          - reauthentication
          title: Purpose
          type: string
        nonce:
          minLength: 1
          title: Nonce
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
      required:
      - version
      - challenge_id
      - request_id
      - user_id
      - device_id
      - purpose
      - nonce
      - expires_at
      title: AuthChallengeResponse
      type: object
    AuthChallengeCreateResponse:
      additionalProperties: false
      properties:
        session_id:
          title: Session Id
          type: string
        challenge:
          $ref: '#/components/schemas/AuthChallengeResponse'
      required:
      - session_id
      - challenge
      title: AuthChallengeCreateResponse
      type: object
    DeviceResponsePayload:
      additionalProperties: false
      properties:
        request_id:
          minLength: 1
          title: Request Id
          type: string
        user_id:
          minLength: 1
          title: User Id
          type: string
        purpose:
          enum:
          - login
          - reauthentication
          title: Purpose
          type: string
        nonce:
          minLength: 1
          title: Nonce
          type: string
        verified:
          title: Verified
          type: boolean
      required:
      - request_id
      - user_id
      - purpose
      - nonce
      - verified
      title: DeviceResponsePayload
      type: object
    AuthVerifyRequest:
      additionalProperties: false
      properties:
        version:
          maximum: 1
          minimum: 1
          title: Version
          type: integer
        challenge_id:
          minLength: 1
          title: Challenge Id
          type: string
        device_id:
          minLength: 1
          title: Device Id
          type: string
        payload:
          $ref: '#/components/schemas/DeviceResponsePayload'
        signature:
          minLength: 1
          title: Signature
          type: string
      required:
      - version
      - challenge_id
      - device_id
      - payload
      - signature
      title: AuthVerifyRequest
      type: object
    SessionResponse:
      additionalProperties: false
      properties:
        session_id:
          title: Session Id
          type: string
        user_id:
          title: User Id
          type: string
        state:
          title: State
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Revoked At
        last_reauth_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Last Reauth At
      required:
      - session_id
      - user_id
      - state
      - created_at
      - expires_at
      title: SessionResponse
      type: object
    AuthVerifyResponse:
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/SessionResponse'
      required:
      - session
      title: AuthVerifyResponse
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: ErrorDetail
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
  securitySchemes:
    PairingCode:
      type: http
      scheme: bearer
